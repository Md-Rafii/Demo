<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6D35D8">
<title>অ্যাডমিন প্যানেল – মাই ওয়ালেট</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EFF8;--sf:#fff;--tx:#1A1530;--mu:#6F6A8A;--ln:#E3DEF2;--pr:#7C3AED;--ok:#12906A;--bad:#E5484D;--grad:linear-gradient(90deg,#A63BEA,#3A82F7)}
@media(prefers-color-scheme:dark){:root{--bg:#0E0C1A;--sf:#171428;--tx:#EAE6FA;--mu:#9B95BB;--ln:#2A2347;--ok:#3DD6A3;--bad:#FF7A7F}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lc{width:100%;max-width:380px;background:var(--sf);border-radius:26px;padding:30px 24px;border:2px solid transparent;
 background:linear-gradient(var(--sf),var(--sf)) padding-box,linear-gradient(135deg,#D63DFF,#2A84FF) border-box;box-shadow:0 18px 45px rgba(74,67,255,.18)}
.lc h1{margin:0;text-align:center;font-size:26px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lc p{text-align:center;color:var(--mu);margin:6px 0 22px}
.in{width:100%;height:50px;border:2px solid var(--ln);border-radius:14px;background:transparent;padding:0 14px;margin-bottom:12px;outline:0}
.in:focus{border-color:var(--pr)}
.btn{border:0;border-radius:13px;height:44px;padding:0 16px;font-weight:600;background:var(--grad);color:#fff}
.btn.full{width:100%;height:50px;font-size:16px}
.btn.alt{background:var(--bg);color:var(--tx)}.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok);color:#fff}
#err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:8px}
/* panel */
header{background:linear-gradient(155deg,#5A2BC4,#8A3FE0 60%,#3A82F7 130%);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{font-size:18px}header small{display:block;opacity:.8;font-size:12px}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:11px;padding:9px 14px;font-weight:600}
main{max-width:1100px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.st{background:var(--sf);border-radius:20px;padding:16px}.st span{color:var(--mu);font-size:13px}.st b{display:block;font-size:30px;margin-top:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 12px}
.bar .in{flex:1;min-width:200px;margin:0;background:var(--sf);height:46px}
.seg{display:flex;background:var(--sf);border-radius:14px;padding:4px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--grad);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.uc{background:var(--sf);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.uh{display:flex;gap:12px;align-items:center}
.av{flex:none;width:46px;height:46px;border-radius:16px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:700}
.uh div{min-width:0}.uh b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uh span{font-size:12.5px;color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px}
.chip{background:var(--bg);border-radius:9px;padding:3px 9px;font-weight:600;color:var(--mu)}
.badge{border-radius:9px;padding:3px 10px;font-weight:700}
.badge.a{background:rgba(18,144,106,.15);color:var(--ok)}.badge.b{background:rgba(229,72,77,.15);color:var(--bad)}
.act{display:flex;gap:8px}.act .btn{flex:1;height:40px;font-size:14px;padding:0 8px}
.empty{text-align:center;color:var(--mu);padding:40px 10px;grid-column:1/-1}
/* modal */
.ov{position:fixed;inset:0;background:rgba(14,8,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.md{background:var(--sf);border-radius:26px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.md h3{margin:0 0 4px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kv div{background:var(--bg);border-radius:16px;padding:12px}.kv span{font-size:12.5px;color:var(--mu)}.kv b{display:block;font-size:22px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px;gap:10px}
.row span:first-child{color:var(--mu)}.row span:last-child{text-align:right;word-break:break-all}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="login" class="hide"><div class="lc">
<h1>🛡️ অ্যাডমিন প্যানেল</h1><p>শুধু অ্যাডমিনদের জন্য</p>
<input class="in" id="em" type="email" placeholder="ইমেইল" autocomplete="email">
<input class="in" id="pw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
<div id="err"></div>
<button class="btn full" id="go">লগইন</button>
</div></div>

<div id="panel" class="hide">
<header><div><b>🛡️ অ্যাডমিন প্যানেল</b><small id="me"></small></div><button id="out">লগআউট</button></header>
<main>
<div class="stats">
<div class="st"><span>মোট ইউজার</span><b id="sAll">০</b></div>
<div class="st"><span>সক্রিয়</span><b id="sAct" style="color:var(--ok)">০</b></div>
<div class="st"><span>বন্ধ (ব্লকড)</span><b id="sBlk" style="color:var(--bad)">০</b></div>
<div class="st"><span>গত ৭ দিনে নতুন</span><b id="sNew">০</b></div>
</div>
<div class="bar">
<input class="in" id="q" placeholder="🔍 নাম, ইমেইল বা ইউজার আইডি দিয়ে খুঁজুন">
<div class="seg" id="flt"><button class="on" data-f="all">সব</button><button data-f="active">সক্রিয়</button><button data-f="blocked">ব্লকড</button></div>
<button class="btn alt" id="csv">CSV</button>
</div>
<div class="grid" id="list"></div>
</main></div>

<div id="mdw" class="ov hide"><div class="md" id="md"></div></div>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,updateDoc,onSnapshot,serverTimestamp,getCountFromServer} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyB64OUEB7sQlIfFPt1jQuSPKw9H1az-7XU",
  authDomain:"my-wallet-fc574.firebaseapp.com",
  projectId:"my-wallet-fc574",
  storageBucket:"my-wallet-fc574.firebasestorage.app",
  messagingSenderId:"901912926518",
  appId:"1:901912926518:web:6388a890716238aae13b97"
});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bn=n=>Number(n).toLocaleString('bn-BD');
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)};
const dt=p=>p&&p.createdAt?p.createdAt.toDate():null;
const fd=d=>d?d.toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'}):'—';

let users=[],flt='all',unsub=null,msg='';
const errMsg=e=>({'auth/invalid-credential':'ইমেইল বা পাসওয়ার্ড ভুল','auth/invalid-email':'ইমেইল সঠিক নয়','auth/too-many-requests':'অনেকবার চেষ্টা হয়েছে, পরে আবার করুন'}[e.code]||e.message);

$('go').onclick=async()=>{$('err').textContent='';
  try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(e){$('err').textContent=errMsg(e)}};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('out').onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
  if(unsub){unsub();unsub=null}
  if(!u){$('login').classList.remove('hide');$('panel').classList.add('hide');$('err').textContent=msg;msg='';return}
  try{
    const a=await getDoc(doc(db,'admins',u.uid));
    if(!a.exists()){msg='এই অ্যাকাউন্টটি অ্যাডমিন নয়।';await signOut(auth);return}
  }catch(e){msg='অ্যাডমিন যাচাই হয়নি ('+(e.code||e.message)+')';await signOut(auth);return}
  $('login').classList.add('hide');$('panel').classList.remove('hide');$('me').textContent=u.email;
  unsub=onSnapshot(collection(db,'profiles'),s=>{
    users=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(dt(b)||0)-(dt(a)||0));draw();
  },e=>toast('ইউজার লোড হয়নি: '+e.code));
});

function draw(){
  const wk=Date.now()-7*864e5;
  $('sAll').textContent=bn(users.length);
  $('sAct').textContent=bn(users.filter(u=>u.status!=='blocked').length);
  $('sBlk').textContent=bn(users.filter(u=>u.status==='blocked').length);
  $('sNew').textContent=bn(users.filter(u=>dt(u)&&dt(u)>wk).length);
  const q=$('q').value.trim().toLowerCase();
  const l=users.filter(u=>(flt==='all'||(flt==='blocked')===(u.status==='blocked'))&&(!q||[u.name,u.email,u.userId].some(x=>String(x||'').toLowerCase().includes(q))));
  $('list').innerHTML=l.map(u=>{const b=u.status==='blocked';return `<div class="uc">
<div class="uh"><div class="av">${esc([...(u.name||'?')][0])}</div><div><b>${esc(u.name)}</b><span>${esc(u.email)}</span></div></div>
<div class="meta"><span class="chip">${esc(u.userId)}</span><span class="chip">যোগদান: ${fd(dt(u))}</span><span class="badge ${b?'b':'a'}">${b?'ব্লকড':'সক্রিয়'}</span></div>
<div class="act"><button class="btn alt" data-v="${u.id}">বিস্তারিত</button><button class="btn ${b?'ok':'bad'}" data-t="${u.id}">${b?'আনব্লক':'ব্লক করুন'}</button></div></div>`}).join('')||'<div class="empty">কোনো ইউজার পাওয়া যায়নি</div>';
}
$('q').oninput=draw;
$('flt').onclick=e=>{const f=e.target.dataset.f;if(!f)return;flt=f;[...$('flt').children].forEach(b=>b.classList.toggle('on',b===e.target));draw()};

async function toggle(id){
  const u=users.find(x=>x.id===id);if(!u)return;const b=u.status==='blocked';
  if(!confirm(b?`${u.name} কে আনব্লক করবেন?`:`${u.name} কে ব্লক করবেন? সে আর অ্যাপ ব্যবহার করতে পারবে না।`))return;
  try{await updateDoc(doc(db,'profiles',id),b?{status:'active'}:{status:'blocked',blockedAt:serverTimestamp()});toast(b?'আনব্লক হয়েছে':'ব্লক করা হয়েছে');if(!$('mdw').classList.contains('hide'))view(id)}
  catch(e){toast('ব্যর্থ: '+e.code)}
}
async function view(id){
  const u=users.find(x=>x.id===id);if(!u)return;const b=u.status==='blocked';
  $('mdw').classList.remove('hide');
  $('md').innerHTML=`<h3>${esc(u.name)}</h3><div style="color:var(--mu);font-size:13px">${esc(u.email)}</div>
<div class="kv" id="kv"><div><span>ওয়ালেট</span><b>…</b></div><div><span>লেনদেন</span><b>…</b></div><div><span>দেনা-পাওনা</span><b>…</b></div><div><span>লক্ষ্য</span><b>…</b></div></div>
<div class="row"><span>ইউজার আইডি</span><span>${esc(u.userId)}</span></div>
<div class="row"><span>যোগদান</span><span>${fd(dt(u))}</span></div>
<div class="row"><span>অবস্থা</span><span>${b?'ব্লকড':'সক্রিয়'}</span></div>
<div class="row"><span>UID</span><span style="font-size:11px">${esc(u.id)}</span></div>
<div class="act" style="margin-top:16px"><button class="btn alt" data-r="${u.id}">পাসওয়ার্ড রিসেট মেইল</button><button class="btn ${b?'ok':'bad'}" data-t="${u.id}">${b?'আনব্লক':'ব্লক'}</button></div>
<button class="btn alt full" style="margin-top:10px" data-x="1">বন্ধ করুন</button>`;
  try{
    const c=await Promise.all(['wallets','txs','debts','goals'].map(n=>getCountFromServer(collection(db,'users',id,n))));
    const L=['ওয়ালেট','লেনদেন','দেনা-পাওনা','লক্ষ্য'];
    const kv=$('kv');if(kv)kv.innerHTML=c.map((x,i)=>`<div><span>${L[i]}</span><b>${bn(x.data().count)}</b></div>`).join('');
  }catch(e){const kv=$('kv');if(kv)kv.innerHTML='<div style="grid-column:1/-1;color:var(--bad)">ডাটা পড়া যায়নি ('+esc(e.code)+')</div>'}
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-v],[data-t],[data-r],[data-x]');
  if(!el&&e.target.id==='mdw')return $('mdw').classList.add('hide');
  if(!el)return;const d=el.dataset;
  if(d.v)view(d.v);
  if(d.t)toggle(d.t);
  if(d.x)$('mdw').classList.add('hide');
  if(d.r){const u=users.find(x=>x.id===d.r);if(u&&confirm(u.email+' এ পাসওয়ার্ড রিসেটের লিংক পাঠাবেন?')){
    try{await sendPasswordResetEmail(auth,u.email);toast('রিসেট মেইল পাঠানো হয়েছে')}catch(x){toast('ব্যর্থ: '+x.code)}}}
});
$('csv').onclick=()=>{
  const r=[['নাম','ইমেইল','ইউজার আইডি','অবস্থা','যোগদান'],...users.map(u=>[u.name,u.email,u.userId,u.status,dt(u)?dt(u).toISOString().slice(0,10):''])];
  const t=r.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='users.csv';a.click();
};
</script>
</body>
</html>
